<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Cell ID Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: radial-gradient(ellipse at 20% 40%, #1a1040 0%, #070b1a 55%, #000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      padding: 40px 24px 20px;
      text-align: center;
    }
    header .badge {
      display: inline-block;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 6px 18px;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 16px;
    }
    header h1 {
      font-size: 28px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.5px;
    }
    header p {
      font-size: 14px;
      color: rgba(255,255,255,0.35);
      margin-top: 6px;
    }

    .cards-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      padding: 20px 24px 80px;
      width: 100%;
    }

    .card-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .card-label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      font-weight: 500;
    }

    .card-frame {
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.07),
        0 24px 60px rgba(0,0,0,0.75),
        0 0 80px rgba(80,60,200,0.12);
      transition: transform 0.35s cubic-bezier(.22,.68,0,1.2), box-shadow 0.35s ease;
      cursor: default;
    }

    .card-frame:hover {
      transform: translateY(-10px) scale(1.015);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.12),
        0 40px 80px rgba(0,0,0,0.85),
        0 0 120px rgba(80,60,200,0.2);
    }

    .card-img {
      display: block;
      max-width: 90vw;
      height: auto;
      border-radius: 20px;
    }

    footer {
      padding: 24px;
      text-align: center;
      color: rgba(255,255,255,0.2);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="badge">E-Cell · ITS Engineering College</div>
    <h1>ID Card</h1>
    <p>Love Chauhan &nbsp;·&nbsp; Creative Designing</p>
  </header>

  <div class="cards-container">
    
  <div class="card-item">
    <div class="card-label">FRONT</div>
    <div class="card-frame">
      <img src="card-front.png" alt="ID Card front" class="card-img" />
    </div>
  </div>

  <div class="card-item">
    <div class="card-label">BACK</div>
    <div class="card-frame">
      <img src="card-back.png" alt="ID Card back" class="card-img" />
    </div>
  </div>

  </div>

  <footer>E-Cell @ I.T.S Engineering College, Greater Noida</footer>
</body>
</html>
